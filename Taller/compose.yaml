version: "3.8"
services:
  mysql_taller:
    # image: lordgehb/taller_docker:database
    build: ./database
    container_name: DB_TALLER
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=taller
      - MYSQL_DATABASE=taller
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/mysql-config/auth.cnf:/etc/mysql/conf.d/auth.cnf
    command:
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 30
  api:
    # image: lordgehb/taller_docker:api
    build: ./api
    container_name: API_TALLER
    ports:
      - "3002:3002"
    depends_on:
      mysql_taller:
        condition: service_healthy
